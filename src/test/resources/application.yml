spring:
  datasource:
    url: jdbc:h2:mem:calendar-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: "!seed"

app:
  jwt:
    secret: test-secret-key-not-for-production-use-32-bytes-minimum-required
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    cookie-secure: false
  cors:
    allowed-origin: http://localhost:4200
