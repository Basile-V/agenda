spring:
  application:
    name: calendar

  datasource:
    url: jdbc:h2:file:./data/calendar;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-please-override-it-with-a-32-byte-value-in-prod}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    cookie-secure: false
