databaseChangeLog:
  - changeSet:
      id: 00002-seed-users
      author: basile
      changes:
        - insert:
            tableName: app_user
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: username, value: admin }
              - column: { name: password_hash, value: "$2a$10$GBiN3MQlggAQ1dpn/0mOHOeAkiTnpNbhG8k63InO48j3Nfrl/HQ36" }
              - column: { name: display_name, value: Administrateur }
              - column: { name: role, value: ADMIN }
        - insert:
            tableName: app_user
            columns:
              - column: { name: id, valueNumeric: 2 }
              - column: { name: username, value: basile }
              - column: { name: password_hash, value: "$2a$10$F5oxjim.f1gkL1.Va71LAOIDQiSxZpHNw74D9qhaGd5ynJ9UYtwCy" }
              - column: { name: display_name, value: Basile }
              - column: { name: role, value: USER }
  - changeSet:
      id: 00002-seed-users-restart-sequence-h2
      author: basile
      dbms: h2
      changes:
        - sql:
            sql: ALTER TABLE app_user ALTER COLUMN id RESTART WITH 3
  - changeSet:
      id: 00002-seed-users-restart-sequence-postgresql
      author: basile
      dbms: postgresql
      changes:
        - sql:
            sql: SELECT setval(pg_get_serial_sequence('app_user', 'id'), 3, false)
